name: Clinkle
description: >-
  Clinkle was a Silicon Valley mobile-payments startup founded in 2012 by
  Stanford student Lucas Duplan. In 2013 it raised roughly $30 million in what
  was then reported as the largest seed round in history, backed by Andreessen
  Horowitz, Peter Thiel, Marc Benioff, Accel's Jim Breyer, Richard Branson, and
  Intel Capital. The company promised a phone-to-phone payments technology but
  never shipped a viable product, launched a poorly received "Treats" debit-card
  app, cycled through multiple pivots and leadership turmoil, and lost its window
  to Venmo and Apple Pay. By 2016 Clinkle had quietly shut down with no official
  announcement. It is retained in the API Evangelist network as a defunct a16z
  portfolio lead; it publishes no live website, developer portal, documentation,
  or API surface today (clinkle.com resolves to a suspended-account page).
